server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: flow-manager
              uri: lb://flow-manager
              predicates:
                - Path=/api/files/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - http://localhost:8085
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                  - Accept
                  - Origin
                allowCredentials: true
                maxAge: 3600

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: read_only